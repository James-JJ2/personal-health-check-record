<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康記錄機器人</title>
<meta name="theme-color" content="#0f6e73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* 版面：頂部匯入列 → 分頁 → 摘要數字在前、明細表在後；單欄，最寬 1120px */
:root{
  --bg:#f1f5f5; --surface:#ffffff; --ink:#15292b; --muted:#5d7275; --line:#d5dfdf;
  --accent:#0f6e73; --accent-soft:#dcefee;
  --good:#2c7a4b; --up:#d2620a; --warn:#a9640a; --crit:#b3362d; --crit-soft:#f8e1de; --warn-soft:#f8ecd3;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1819; --surface:#162425; --ink:#e3eeee; --muted:#93a8aa; --line:#2a3d3f;
    --accent:#5cc2c4; --accent-soft:#173638;
    --good:#6cc08c; --up:#f59a4c; --warn:#e0a44a; --crit:#ee8177; --crit-soft:#40211e; --warn-soft:#3b2f17;
    color-scheme:dark;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0e1819; --surface:#162425; --ink:#e3eeee; --muted:#93a8aa; --line:#2a3d3f;
  --accent:#5cc2c4; --accent-soft:#173638;
  --good:#6cc08c; --up:#f59a4c; --warn:#e0a44a; --crit:#ee8177; --crit-soft:#40211e; --warn-soft:#3b2f17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-size:26px;margin:0;line-height:1.25;text-wrap:balance}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
h2{font-size:16px;margin:0 0 10px;font-weight:700;text-wrap:balance}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:6px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:10px;background:var(--surface);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;flex:1 1 280px}
.drop .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drop label.chk{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.notice{font-size:13px;padding:8px 12px;border-radius:6px;background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.notice.err{background:var(--crit-soft);border-left-color:var(--crit)}
.notice[hidden]{display:none}
nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted)}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .n{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:700;border-bottom:0}
tr.detail td{background:var(--bg);font-size:13px}
td button.exp{padding:0 6px;font-size:12px;line-height:1.6}
.bar{display:grid;grid-template-columns:minmax(120px,2fr) 3fr 44px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.bar .track{background:var(--accent-soft);border-radius:3px;height:10px}
.bar .fill{background:var(--accent);height:10px;border-radius:3px}
.bar .c{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:0 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.hi,.pill.lo{color:var(--crit);background:var(--crit-soft)}
.pill.ok{color:var(--good)}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lab{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.lab.flag{border-left:4px solid var(--crit)}
.lab .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lab .name{font-weight:700;font-size:14px}
.lab .latest{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.lab .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lab svg{width:100%;height:auto;display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input[type=search],select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input[type=search]{flex:1 1 220px}
pre{white-space:pre-wrap;font-family:var(--body);margin:0;font-size:14px}
footer{font-size:12px;color:var(--muted);max-width:65ch}
.view[hidden],.sample[hidden]{display:none}
td.out{color:var(--crit);font-weight:700}
#v-labs td,#v-overview td{white-space:nowrap}
tr.bad>td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
input.pick{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
label[for^=pick]{cursor:pointer}
.labs .lab{background:var(--bg)}
.view{display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who select{font-weight:700}
.filebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.filebar .st{flex:1 1 240px}
.filebar .st strong{color:var(--ink)}
.panel{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel[hidden]{display:none}
.panel .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.panel textarea{font:inherit;width:100%;min-height:120px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.panel input[type=text],.panel input[type=date],.panel input[type=number]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
.rv td{vertical-align:middle}
.rv input[type=text]{width:100%}
.rv td.c-v input{width:90px;text-align:right}
.rv td.c-u input{width:80px}
.rv td.c-r input{width:110px}
.thumb{max-height:160px;max-width:100%;border:1px solid var(--line);border-radius:6px}
.prog{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.prog>div{height:8px;background:var(--accent);width:0}
.remind{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.remind .big{font-size:22px;font-weight:700}
.remind.due{border-left:4px solid var(--crit)}
.pill.src{color:var(--accent)}
button.del{padding:0 6px;font-size:12px;color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;cursor:pointer}
.sample{display:inline-block;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);font-size:12px;padding:0 8px;border-radius:4px;margin-left:8px;vertical-align:middle;font-family:var(--body);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>健康記錄機器人<span class="sample" id="sampleTag">示範資料</span></h1>
      <p class="sub" id="metaLine"></p>
    </div>
    <div class="hbtns">
      <span class="who"><label for="person" class="sub">目前的人</label><select id="person" aria-label="目前的人"></select><button type="button" id="btnPerson">管理成員</button></span>
      <button id="btnTheme" type="button">切換深色</button><button class="primary" id="btnXlsx" type="button">匯出 Excel</button>
    </div>
  </header>

  <div class="filebar card" id="filebar">
    <span class="st" id="fileSt"></span>
    <button type="button" id="btnFile">連結資料檔</button>
    <button type="button" id="btnBackup">下載備份</button>
    <button type="button" id="btnRestore">讀取備份</button>
    <button type="button" id="btnInstall" hidden>安裝成桌面 App</button>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  </div>

  <div class="drop" id="drop">
    <p><strong>把健康存摺 XML 檔、統計 Excel，或報告的截圖／照片拖到這裡</strong>。截圖和照片會自動辨識文字，核對後才存入。資料只在這台電腦處理，不會上傳。</p>
    <div class="actions">
      <input type="file" id="file" accept=".xml,.xlsx,text/xml" multiple hidden>
      <input type="file" id="imgFile" accept="image/*" multiple hidden>
      <button type="button" id="btnPick">匯入健康存摺</button>
      <button type="button" class="primary" id="btnImg">拍照／截圖匯入</button>
      <button type="button" id="btnPaste">貼上文字</button>
      <button type="button" id="btnManual">手動新增</button>
      <button type="button" id="btnClear">清除這個人的資料</button>
    </div>
  </div>
  <div class="notice" id="msg" hidden></div>

  <section class="panel" id="pPerson" hidden></section>
  <section class="panel" id="pImport" hidden></section>

  <nav role="tablist" id="tabs">
    <button role="tab" type="button" data-v="focus" aria-selected="true">重點</button>
    <button role="tab" type="button" data-v="overview" aria-selected="false">總覽</button>
    <button role="tab" type="button" data-v="labs" aria-selected="false">檢驗趨勢</button>
    <button role="tab" type="button" data-v="visits" aria-selected="false">門診紀錄</button>
    <button role="tab" type="button" data-v="meds" aria-selected="false">用藥</button>
    <button role="tab" type="button" data-v="dental" aria-selected="false">牙科</button>
    <button role="tab" type="button" data-v="other" aria-selected="false">疫苗與影像</button>
  </nav>

  <section class="view" id="v-focus"></section>
  <section class="view" id="v-overview" hidden></section>
  <section class="view" id="v-labs" hidden></section>
  <section class="view" id="v-visits" hidden></section>
  <section class="view" id="v-meds" hidden></section>
  <section class="view" id="v-dental" hidden></section>
  <section class="view" id="v-other" hidden></section>

  <footer>
    欄位名稱（部分負擔、健保點數等）是依健康存摺 XML 的內容推定，請以健康存摺 App 顯示為準。同一次就醫常被拆成看診、檢驗、藥局調劑多筆紀錄，所以另外以「日期＋院所」計算就醫次數。拍照辨識可能認錯字或數字，存入前請逐列核對。本工具只整理資料，不提供醫療判讀；檢驗結果請與醫師討論。
  </footer>
</div>

<script src="lib/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
var KEY="health-robot-v2";
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var fmtD=function(s){return /^\d{8}$/.test(s||"")?s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6):(s||"")};
var nf=function(n){return (n||0).toLocaleString("zh-TW")};
var toNum=function(s){var n=parseFloat(s);return isFinite(n)?n:0};
var state={data:null,sample:true,q:"",year:"",sel:{},selInit:false,series:[]};
var store=null; /* {version,cur,savedAt,people:[{id,name,data,manual,doses,pins,months,sel}]} */
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var today=function(){var d=new Date();return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)};
function newPerson(name,pins){return{id:uid(),name:name,data:null,manual:[],doses:[],pins:pins||[],months:3,sel:null}}
function defaultStore(){var a=newPerson("我",["甲狀腺"]),b=newPerson("太太",[]);return{version:2,cur:a.id,savedAt:0,people:[a,b]}}
function person(){var p=null;store.people.forEach(function(x){if(x.id===store.cur)p=x});return p||store.people[0]}
function fixStore(s){
  if(!s||!s.people||!s.people.length)return null;
  s.people.forEach(function(p){p.id=p.id||uid();p.name=p.name||"未命名";p.manual=p.manual||[];p.doses=p.doses||[];p.pins=p.pins||[];p.months=p.months||3});
  if(!s.people.some(function(p){return p.id===s.cur}))s.cur=s.people[0].id;s.version=2;return s;
}

/* ---------- 本機儲存：IndexedDB（瀏覽器內）＋ 資料檔（可放在雲端同步資料夾） ---------- */
var idb=(function(){var dbp=null;
  function db(){if(!dbp)dbp=new Promise(function(res,rej){if(!window.indexedDB)return rej(new Error("no idb"));var r=indexedDB.open("health-robot",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}});return dbp}
  function op(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction("kv",mode),q=fn(t.objectStore("kv"));t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
  return{get:function(k){return op("readonly",function(s){return s.get(k)})},set:function(k,v){return op("readwrite",function(s){return s.put(v,k)})},del:function(k){return op("readwrite",function(s){return s.delete(k)})}};
})();
var fileH=null,fileOk=false,fileTimer=null,fileErr="";
var hasFS=!!(window.showSaveFilePicker&&window.showOpenFilePicker);
function saveAll(){
  store.savedAt=Date.now();
  var json=JSON.stringify(store);
  idb.set("store",json).catch(function(){try{localStorage.setItem(KEY,json)}catch(e){}});
  if(fileH&&fileOk){clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,400)}
  fileStatus();
}
function writeFile(){
  if(!fileH)return Promise.resolve();
  return fileH.createWritable().then(function(w){return w.write(JSON.stringify(store,null,1)).then(function(){return w.close()})})
    .then(function(){fileErr="";fileStatus()}).catch(function(e){fileErr="寫入資料檔失敗（"+(e&&e.message||e)+"）";fileStatus()});
}
function readHandle(h){return h.getFile().then(function(f){return f.text()}).then(function(t){return t.trim()?fixStore(JSON.parse(t)):null})}
function adoptHandle(h,mode){ /* mode: open = 以檔案為準；create = 用目前資料寫入；auto = 新的那份為準 */
  fileH=h;fileOk=true;idb.set("fileHandle",h).catch(function(){});
  if(mode==="create")return writeFile().then(function(){say("已建立資料檔「"+h.name+"」，之後每次變更都會自動存檔。")});
  return readHandle(h).then(function(s){
    if(s&&(mode==="open"||(s.savedAt||0)>(store.savedAt||0))){store=s;afterStoreChange();idb.set("store",JSON.stringify(store)).catch(function(){});if(mode==="open")say("已開啟資料檔「"+h.name+"」。")}
    else writeFile();
    fileStatus();
  }).catch(function(e){say("無法讀取資料檔："+e.message,true)});
}
function fileStatus(){
  var st=$("fileSt");if(!st)return;
  var n=store.people.length,names=store.people.map(function(p){return p.name}).join("、");
  if(fileH&&fileOk)st.innerHTML='資料檔：<strong>'+esc(fileH.name)+'</strong>，變更會自動存檔。'+(fileErr?' <span style="color:var(--crit)">'+esc(fileErr)+'</span>':"");
  else if(fileH)st.innerHTML='上次用的資料檔是 <strong>'+esc(fileH.name)+'</strong>，按「重新連結」繼續自動存檔。';
  else if(hasFS)st.innerHTML='資料目前只存在這個瀏覽器（'+n+' 位成員：'+esc(names)+'）。按「連結資料檔」存成檔案，放在 iCloud、Google 雲端硬碟或 OneDrive 的資料夾，兩台電腦就能共用。';
  else st.innerHTML='資料存在這個瀏覽器（'+n+' 位成員：'+esc(names)+'）。這個瀏覽器不支援自動存檔到檔案，要換電腦時請用「下載備份」→ 另一台「讀取備份」。';
  $("btnFile").hidden=!hasFS;$("btnFile").textContent=fileH&&!fileOk?"重新連結":fileH?"更換資料檔":"連結資料檔";
}
function afterStoreChange(){state.selInit=false;state.q="";state.year="";refreshData();renderPersons();render()}

/* 把手動／拍照紀錄併入檢驗資料 */
function refreshData(){
  var p=person(),has=!!(p.data||p.manual.length);
  state.sample=!has;
  if(!has){state.data=sampleData();return}
  var b=p.data||{meta:{},visits:[],dental:[],vacc:[],labs:[],imaging:[]};
  var labs=b.labs.concat(p.manual.map(function(m){return{visit:m.date,date:m.date,up:"M"+m.id,inst:m.inst||"",code:"",order:"",item:m.name,result:m.value+"",ref:m.ref||"",key:m.key,mid:m.id,src:m.src,unit:m.unit||""}}));
  state.data={meta:b.meta,visits:b.visits,dental:b.dental,vacc:b.vacc,imaging:b.imaging,labs:labs.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0})};
}
var dl=null;
if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(x){dl=x}).catch(function(){})}

/* ---------- 解析 XML ---------- */
function kids(el){var o={};for(var i=0;i<el.children.length;i++){var c=el.children[i];if(!c.children.length)o[c.tagName]=(c.textContent||"").trim()}return o}
function pairs(o,p,from,to){var a=[];for(var k=from;k<to;k+=2){if(o[p+k])a.push({c:o[p+k],n:o[p+(k+1)]||""})}return a}
function parseXml(text){
  var doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror"))throw new Error("不是有效的 XML 檔");
  var b=doc.getElementsByTagName("bdata")[0];
  if(!b)throw new Error("找不到健康存摺資料（bdata）。請確認是健康存摺下載的 XML 檔");
  var d={meta:{},visits:[],dental:[],vacc:[],labs:[],imaging:[]};
  for(var i=0;i<b.children.length;i++){
    var el=b.children[i],t=el.tagName,o=kids(el);
    if(t==="b1.1")d.meta.id=el.textContent.trim();
    else if(t==="b1.2")d.meta.dl=el.textContent.trim();
    else if(t==="r1"&&el.children.length){
      var items=[];for(var j=0;j<el.children.length;j++){if(el.children[j].tagName==="r1_1"){var x=kids(el.children[j]);items.push({code:x["r1_1.1"]||"",name:x["r1_1.2"]||"",qty:toNum(x["r1_1.3"]),days:toNum(x["r1_1.4"])})}}
      d.visits.push({date:o["r1.5"]||"",rx:o["r1.6"]||"",inst:o["r1.4"]||"",instId:o["r1.3"]||"",seq:o["r1.7"]||"",dx:o["r1.8"]||"",dxName:o["r1.9"]||"",sec:pairs(o,"r1.",14,28),copay:toNum(o["r1.12"]),pts:toNum(o["r1.13"]),items:items});
    }

/* ---------- 深色 / 淺色 ---------- */
var root=document.documentElement;
function curTheme(){var t=root.getAttribute("data-theme");if(t==="dark"||t==="light")return t;return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function labelTheme(){$("btnTheme").textContent=curTheme()==="dark"?"切換淺色":"切換深色"}
try{var st0=localStorage.getItem(KEY+"-theme");if(st0==="dark"||st0==="light")root.setAttribute("data-theme",st0)}catch(e){}
$("btnTheme").addEventListener("click",function(){var n=curTheme()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem(KEY+"-theme",n)}catch(e){}labelTheme()});
if(window.MutationObserver)new MutationObserver(labelTheme).observe(root,{attributes:true,attributeFilter:["data-theme"]});
labelTheme();
/* ---------- 啟動 ---------- */
function boot(s){
  store=fixStore(s)||defaultStore();
  if(!s){try{var old=JSON.parse(localStorage.getItem("mhb-stats-v1")||"null");if(old&&old.visits){store.people[0].data=old;}}catch(e){}} /* 舊版保留的資料搬到「我」 */
  refreshData();renderPersons();render();
  idb.get("fileHandle").then(function(h){if(!h||!h.queryPermission)return;fileH=h;return h.queryPermission({mode:"readwrite"}).then(function(r){fileOk=r==="granted";if(fileOk)return adoptHandle(h,"auto");fileStatus()})}).catch(function(){}).then(fileStatus);
}
idb.get("store").then(function(t){return t?JSON.parse(t):null}).catch(function(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}).then(boot,function(){boot(null)});
})();
